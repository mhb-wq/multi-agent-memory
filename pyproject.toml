[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ours-state-sleep"
version = "0.1.0"
description = "Card-State-Sleep multi-user memory and baseline adapters"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]
server = ["fastapi>=0.115,<0.116", "uvicorn>=0.30"]
baselines = ["numpy", "sentence-transformers>=4.1,<5"]
mem0 = ["mem0ai==2.2.1"]
amem = ["nltk==3.10.4", "litellm==1.61.20", "rank-bm25", "scikit-learn", "transformers", "requests"]

[project.scripts]
ours-memory = "ours_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

